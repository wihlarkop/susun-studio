name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend
        run: bun run check

      - name: Lint frontend
        run: bun run lint

      - name: Check frontend formatting
        run: bun run fmt:check

      - name: Checkout susun (sibling path dependency)
        uses: actions/checkout@v6
        with:
          repository: wihlarkop/susun
          path: susun-src

      - name: Link susun as a sibling directory
        run: ln -s "$GITHUB_WORKSPACE/susun-src" "$GITHUB_WORKSPACE/../susun"

      - name: Build daemon sidecar
        run: bun run build:sidecar

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check Rust workspace
        run: cargo check --workspace

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace

  credential-platform-check:
    name: Credential platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout susun (sibling path dependency)
        uses: actions/checkout@v6
        with:
          repository: wihlarkop/susun
          path: susun-src

      - name: Link susun as a sibling directory
        if: runner.os != 'Windows'
        shell: bash
        run: ln -s "$GITHUB_WORKSPACE/susun-src" "$GITHUB_WORKSPACE/../susun"

      - name: Link susun as a sibling directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item `
            -ItemType Junction `
            -Path (Join-Path $env:GITHUB_WORKSPACE "..\susun") `
            -Target (Join-Path $env:GITHUB_WORKSPACE "susun-src")

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check credential integration
        run: cargo check -p susun-studio-daemon

      - name: Test credential modules
        run: "cargo test -p susun-studio-daemon registry::"
